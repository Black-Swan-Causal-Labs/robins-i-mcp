[project]
name = "robins-mcp"
version = "0.1.0"
description = "MCP server implementing ROBINS-I V2 (follow-up/cohort) as a deterministic, provenanced risk-of-bias engine for one result of a non-randomized study"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Black Swan Causal Labs" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Pinned to <2 deliberately: mcp 2.0 replaced FastMCP with MCPServer at a new
    # import path. target-mcp runs 1.28.x in production, and migrating both
    # servers to the 2.0 API is its own piece of work. See docs/DECISIONS.md.
    "mcp[cli]>=1.9,<2",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
robins-mcp = "robins_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robins_mcp*"]

[tool.setuptools.package-data]
robins_mcp = ["specs/*.yaml"]
